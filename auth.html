<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — AI Atlas</title>
<link rel="stylesheet" href="styles/atlas.css" />
<link rel="stylesheet" href="styles/app.css" />
<style>
  .auth-wrap{min-height:100dvh;display:grid;place-items:center;padding:24px;position:relative;z-index:2}
  .auth-card{width:100%;max-width:410px;padding:34px 30px;border-radius:var(--r-lg,18px);position:relative;overflow:hidden}
  .auth-card .glow{position:absolute;width:320px;height:320px;border-radius:50%;filter:blur(110px);opacity:.18;top:-150px;right:-80px;background:var(--indigo,#6366F1)}
  .auth-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:22px}
  .auth-brand img{width:28px;height:28px}
  .auth-tabs{display:flex;gap:6px;background:rgba(20,20,32,.6);border:1px solid var(--line,#2a2a3a);border-radius:12px;padding:5px;margin-bottom:22px}
  .auth-tabs button{flex:1;padding:9px;border:0;background:transparent;color:var(--ink-mute,#9aa);font:inherit;font-size:13.5px;border-radius:8px;cursor:pointer;transition:.15s}
  .auth-tabs button.active{background:var(--indigo,#6366F1);color:#fff}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:12px;color:var(--ink-mute,#9aa);margin-bottom:6px;font-family:var(--mono,monospace)}
  .fld input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line,#2a2a3a);background:rgba(12,12,20,.6);color:var(--ink,#eee);font:inherit;font-size:14px;outline:none;transition:.15s}
  .fld input:focus{border-color:var(--indigo,#6366F1)}
  .auth-msg{font-size:13px;margin:4px 0 14px;min-height:18px}
  .auth-msg.err{color:#FB7185}
  .auth-msg.ok{color:#34D399}
  .btn-block{width:100%;justify-content:center;padding:12px}
  .auth-foot{margin-top:18px;text-align:center}
</style>
</head>
<body data-page="auth">
<div class="atlas-bg"></div>
<div class="atlas-grid"></div>

<div class="auth-wrap">
  <div class="auth-card glass">
    <div class="glow"></div>
    <a class="auth-brand" href="index.html"><img src="assets/atlas-mark.png" alt="" /> AI Atlas</a>

    <div class="auth-tabs">
      <button id="tab-in" class="active" type="button">Sign in</button>
      <button id="tab-up" type="button">Create account</button>
    </div>

    <form id="auth-form" autocomplete="on">
      <div class="fld" id="fld-name" style="display:none">
        <label for="name">Full name</label>
        <input id="name" type="text" placeholder="Ada Lovelace" autocomplete="name" />
      </div>
      <div class="fld">
        <label for="email">Email</label>
        <input id="email" type="email" required placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="fld">
        <label for="password">Password</label>
        <input id="password" type="password" required minlength="6" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div class="auth-msg" id="msg"></div>
      <button class="btn btn-primary btn-block" id="submit" type="submit">Sign in ›</button>
    </form>

    <div class="auth-foot">
      <a class="muted" href="index.html" style="font-size:13px">← Back to landing</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/modules-manifest.js"></script>
<script src="js/atlas-app.js"></script>
<script>
  (function () {
    var mode = 'in';                 // 'in' | 'up'
    var fName = document.getElementById('fld-name');
    var msg = document.getElementById('msg');
    var submit = document.getElementById('submit');
    var pw = document.getElementById('password');

    function setMode(m) {
      mode = m;
      document.getElementById('tab-in').classList.toggle('active', m === 'in');
      document.getElementById('tab-up').classList.toggle('active', m === 'up');
      fName.style.display = m === 'up' ? '' : 'none';
      submit.textContent = m === 'up' ? 'Create account ›' : 'Sign in ›';
      pw.setAttribute('autocomplete', m === 'up' ? 'new-password' : 'current-password');
      say('', '');
    }
    function say(t, cls) { msg.textContent = t; msg.className = 'auth-msg ' + (cls || ''); }

    document.getElementById('tab-in').onclick = function () { setMode('in'); };
    document.getElementById('tab-up').onclick = function () { setMode('up'); };

    document.getElementById('auth-form').addEventListener('submit', function (e) {
      e.preventDefault();
      if (!window.Atlas) { say('Supabase is not configured yet — see js/supabase-config.js', 'err'); return; }
      var email = document.getElementById('email').value.trim();
      var password = pw.value;
      var name = document.getElementById('name').value.trim();
      submit.disabled = true;
      say('Working…', '');

      var p = mode === 'up'
        ? window.Atlas.signUp(email, password, name)
        : window.Atlas.signIn(email, password);

      p.then(function (res) {
        submit.disabled = false;
        if (res.error) { say(res.error.message, 'err'); return; }
        if (mode === 'up' && !(res.data && res.data.session)) {
          say('Account created — check your email to confirm, then sign in.', 'ok');
          setMode('in');
          return;
        }
        say('Success — redirecting…', 'ok');
        location.replace('app.html');
      }).catch(function (err) {
        submit.disabled = false;
        say((err && err.message) || 'Something went wrong.', 'err');
      });
    });
  })();
</script>
</body>
</html>
